name: Release Wheels

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to PyPI after build"
        required: true
        default: "false"
  push:
    tags:
      - "v*"

jobs:
  build_wheels:
    name: Build manylinux wheels
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install cibuildwheel==2.21.3

      - name: Build wheels
        env:
          CIBW_BUILD: "cp310-manylinux_x86_64 cp311-manylinux_x86_64 cp312-manylinux_x86_64"
          CIBW_SKIP: "*-musllinux_*"
          CIBW_BUILD_VERBOSITY: "1"
          CIBW_TEST_COMMAND: "python -c \"import sage_anns\""
          CIBW_TEST_REQUIRES: ""
          CIBW_BEFORE_ALL_LINUX: >-
            yum -y update &&
            yum -y install boost-devel gflags-devel glog-devel openblas-devel lapack-devel
            libaio-devel pkgconfig ninja-build
          CIBW_BEFORE_BUILD: >-
            python -m pip install --upgrade pip cmake ninja &&
            python -m pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
          CIBW_REPAIR_WHEEL_COMMAND: >-
            bash -lc "TORCH_LIB=$(python -c \"import os, torch; print(os.path.join(os.path.dirname(torch.__file__), 'lib'))\") && auditwheel repair -w {dest_dir} {wheel} --lib-sdir $TORCH_LIB"
        run: |
          cibuildwheel --output-dir dist

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-manylinux
          path: dist/*.whl

  publish_pypi:
    name: Publish to PyPI
    needs: [build_wheels]
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish == 'true'
    permissions:
      id-token: write
    steps:
      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          name: wheels-manylinux
          path: dist

      - name: Publish
        uses: pypa/gh-action-pypi-publish@v1.10.0
        with:
          packages-dir: dist
